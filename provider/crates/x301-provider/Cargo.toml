[package]
name = "x301-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "X301-v2 OpenSSL provider with optional TLS X301MLKEM1024 integration"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "x301_v2"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
test-failpoint = []
test-fuzz-coverage = []
test-sanitizer = []
pki-experiment = []
tls-x301-mlkem1024 = ["pki-experiment"]
secret-taint-instrumentation = [
    "x301-core/secret-taint-instrumentation",
    "dep:ed301-valgrind-client",
]

[dependencies]
crypto-bigint = { path = "../../../rust/vendor/crypto-bigint", default-features = false }
x301-core = { path = "../../../rust/crates/x301", default-features = false }
ed301-valgrind-client = { path = "../../../rust/secret-taint/valgrind-client", optional = true }
zeroize = { version = "=1.9.0", default-features = false }

[dev-dependencies]
serde_json = "=1.0.150"

[build-dependencies]
cc = { version = "=1.2.66", default-features = false }
