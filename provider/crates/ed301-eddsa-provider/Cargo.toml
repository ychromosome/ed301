[package]
name = "ed301-eddsa-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Ed301-EdDSA-v2 OpenSSL provider with optional codecs and TLS"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "ed301_eddsa_v2"
crate-type = ["cdylib"]
path = "src/lib.rs"

# The ordinary module is built with the default (empty) feature set.  Every
# diagnostic or TLS surface is compiled into a separately named module,
# never into the ordinary provider.
[features]
default = []
test-failpoint = []
test-sanitizer = []
pki-experiment = []
tls-experiment = ["pki-experiment"]
tls-collider = ["pki-experiment"]
secret-taint-instrumentation = ["ed301-eddsa/secret-taint-instrumentation"]
sign-self-verify = ["ed301-eddsa/sign-self-verify"]

[dependencies]
crypto-bigint = { path = "../../../rust/vendor/crypto-bigint", default-features = false }
ed301-eddsa = { path = "../../../rust/crates/ed301-eddsa" }
zeroize = { version = "=1.9.0", default-features = false }

[build-dependencies]
cc = { version = "=1.2.66", default-features = false }
