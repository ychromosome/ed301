# Explicit activation of the two ED301-v2 TLS-capable provider modules.
# No crypto-policy replacement and no implicit DEFAULT TLS group changes.
[provider_sect]
ed301_eddsa_v2_tls = ed301_v2_rpm_provider
x301_v2_tls = x301_v2_rpm_provider

[ed301_v2_rpm_provider]
activate = 1

[x301_v2_rpm_provider]
activate = 1
